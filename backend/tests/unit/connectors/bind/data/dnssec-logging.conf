// dnssec-policy, key-store, inline signing and a detailed logging block.
key-store "disk" {
	directory "keys";
};

dnssec-policy "standard" {
	keys {
		ksk key-store "disk" lifetime unlimited algorithm ecdsap256sha256;
		zsk key-store "disk" lifetime P90D algorithm ecdsap256sha256;
	};
	dnskey-ttl 3600;
	max-zone-ttl 86400;
	nsec3param iterations 0 optout no salt-length 0;
	signatures-validity 14d;
	signatures-refresh 5d;
};

options {
	directory "/var/cache/bind";
	key-directory "keys";
	dnssec-validation auto;
};

logging {
	channel default_log {
		file "/var/log/named/default.log" versions 3 size 20m;
		print-time yes;
		print-category yes;
		print-severity yes;
		severity info;
	};
	channel queries_log {
		file "/var/log/named/queries.log" versions 5 size 50m;
		print-time iso8601-utc;
		severity dynamic;
	};
	channel null_ch { null; };
	category default { default_log; default_debug; };
	category queries { queries_log; };
	category lame-servers { null_ch; };
	category dnssec { default_log; };
};

zone "example.lan" {
	type primary;
	file "example.lan.db";
	dnssec-policy "standard";
	inline-signing yes;
	allow-update { none; };
};

zone "insecure.example.lan" {
	type primary;
	file "insecure.example.lan.db";
	dnssec-policy insecure;
};
