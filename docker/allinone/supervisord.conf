; Process supervisor of the all-in-one image. Everything logs to the container output.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:named]
command=/usr/sbin/named -g -u bind -c /etc/bind/named.conf
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:kea-dhcp4]
command=/usr/local/bin/kea-run /run/kea/kea4-ctrl-socket /usr/sbin/kea-dhcp4 -c /etc/kea/kea-dhcp4.conf
user=_kea
environment=KEA_CONTROL_SOCKET_DIR="/run/kea",KEA_PIDFILE_DIR="/run/kea",KEA_LOCKFILE_DIR="/run/kea"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:kea-dhcp6]
command=/usr/local/bin/kea-run /run/kea/kea6-ctrl-socket /usr/sbin/kea-dhcp6 -c /etc/kea/kea-dhcp6.conf
user=_kea
environment=KEA_CONTROL_SOCKET_DIR="/run/kea",KEA_PIDFILE_DIR="/run/kea",KEA_LOCKFILE_DIR="/run/kea"
priority=20
autostart=%(ENV_KEA_DHCP6)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:kea-dhcp-ddns]
command=/usr/local/bin/kea-run /run/kea/kea-ddns-ctrl-socket /usr/sbin/kea-dhcp-ddns -c /etc/kea/kea-dhcp-ddns.conf
user=_kea
environment=KEA_CONTROL_SOCKET_DIR="/run/kea",KEA_PIDFILE_DIR="/run/kea",KEA_LOCKFILE_DIR="/run/kea"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pelagos]
command=/opt/pelagos/venv/bin/gunicorn -c /opt/pelagos/gunicorn_conf.py pelagos.app:wsgi_app()
directory=/opt/pelagos
user=pelagos
umask=027
environment=HOME="/var/lib/pelagos"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pelagos-collector]
command=/opt/pelagos/venv/bin/pelagos collector
directory=/opt/pelagos
user=pelagos
umask=027
environment=HOME="/var/lib/pelagos"
priority=40
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
