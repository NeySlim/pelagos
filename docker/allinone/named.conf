// BIND 9 configuration of the all-in-one image (Debian bind9). rndc.key is generated by
// the entrypoint; rndc and the statistics channel stay on the loopback, the node runs in
// the same container. "pelagos install" or "pelagos import" add the include lines for
// /etc/bind/pelagos when the node adopts this server.

include "/etc/bind/rndc.key";

controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-pelagos"; };
};

statistics-channels {
    inet 127.0.0.1 port 8053 allow { 127.0.0.1; };
};

options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { any; };
    recursion no;
    allow-query { any; };
    allow-transfer { none; };
    dnssec-validation no;
};

include "/etc/bind/named.conf.local";
