{
  "Dhcp6": {
    "interfaces-config": {
      "interfaces": [],
      "service-sockets-require-all": false
    },
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea6-ctrl-socket"
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases6.csv",
      "lfc-interval": 3600
    },
    "hooks-libraries": [
      { "library": "libdhcp_lease_cmds.so" },
      { "library": "libdhcp_stat_cmds.so" }
    ],
    "dhcp-ddns": {
      "enable-updates": false,
      "server-ip": "127.0.0.1",
      "server-port": 53001
    },
    "valid-lifetime": 3600,
    "renew-timer": 900,
    "rebind-timer": 1800,
    "preferred-lifetime": 2700,
    "subnet6": [],
    "loggers": [
      {
        "name": "kea-dhcp6",
        "output_options": [ { "output": "stdout" } ],
        "severity": "INFO"
      }
    ]
  }
}
