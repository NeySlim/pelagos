// Legacy configuration kept for the security audit tests: weak keys, open
// listeners, address-based updates. Paths follow the Debian layout.
include "/etc/bind/named.conf.options";
include "/etc/bind/named.conf.local";
include "/etc/bind/rndc.key";

controls {
	inet * port 953 allow { any; } keys { "rndc-key"; };
};

statistics-channels {
	inet 0.0.0.0 port 8053 allow { any; };
};
