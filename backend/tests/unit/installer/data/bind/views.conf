// Views with per-view zones, an include inside options, and comments of all three kinds.
options {
	directory "/var/named"; # trailing comment
	include "/etc/named/pelagos/options.conf";
	recursion no;
};
acl "trusted" { 192.0.2.0/24; 2001:db8::/64; !192.0.2.250; };
view "internal" {
	match-clients { trusted; };
	zone "internal.example.lan" {
		type primary;
		file "internal.example.lan.db";
		allow-transfer { key ddi-read; };
	};
};
view "external" {
	match-clients { any; };
	zone "example.lan" IN {
		type primary;
		file "example.lan.db";
		/* multi
		   line */
		update-policy { grant ddi-admin zonesub A AAAA; grant "kea-ddns" zonesub A AAAA PTR DHCID; };
	};
	zone "example.net" { type forward; forward only; forwarders { 192.0.2.53 port 5353; }; };
};
