# Hash comment at the top, then C++ and C comments everywhere a token may sit.
// C++ style comment
/* C style comment
   spanning lines, with "quotes", braces { } and semicolons ; inside */
options {	# trailing hash comment after a brace
	directory "/var/cache/bind";// no space before the comment
	recursion /* inline */ no;
	allow-query { any; /* inside a list */ }; # after the statement
	listen-on port 53 {
		127.0.0.1;	// loopback
		192.0.2.1;	/* lan */
	};
	version "not \"telling\" # not a comment // nor this";
};

/**/ zone "example.lan" { type primary; file "example.lan.db"; }; /* same line */
zone "2.0.192.in-addr.arpa"{type primary;file "2.0.192.in-addr.arpa.db";};

# last line without a newline at the end