# SPDX-License-Identifier: Apache-2.0
# Packages and images with their tests: the deb (Debian 13), the rpms (RHEL 9 and 10), the node
# and all-in-one images. A push or pull request touching packaging/ or docker/ builds the amd64
# set only (deb, rpm el10, images). The nightly run (when main moved in the last day), a manual
# run and the release workflow (workflow_call, full) build everything, arm64 included, on native
# arm64 runners. Called by release.yml it also records the sums of the tested packages and saves
# the tested images; it never publishes anything itself.
name: packages

on:
  push:
    branches: [main]
    paths: &packaging-paths
      - packaging/**
      - docker/**
      - .github/workflows/packages.yml
  pull_request:
    paths: *packaging-paths
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Ref to build (the release tag)
        type: string
        required: true
      full:
        description: amd64 and arm64, rpm el9 and el10, tested sums and saved images
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: packages-${{ inputs.ref || github.ref }}-${{ github.event_name }}
  # A newer push supersedes the running one; a release run always runs to the end.
  cancel-in-progress: ${{ !inputs.ref }}

jobs:
  frontend:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.mode.outputs.run }}
      arches: ${{ steps.mode.outputs.arches }}
      els: ${{ steps.mode.outputs.els }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Mode (full set on release, nightly and manual runs)
        id: mode
        env:
          FULL: ${{ inputs.full }}
        run: |
          run=true arches='["amd64"]' els='[10]'
          case "$GITHUB_EVENT_NAME" in schedule|workflow_dispatch) FULL=true ;; esac
          [ "$FULL" = true ] && arches='["amd64","arm64"]' els='[9,10]'
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ -z "$(git log -1 --since=25.hours --format=%h)" ]; then
            run=false
          fi
          printf 'run=%s\narches=%s\nels=%s\n' "$run" "$arches" "$els" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.mode.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        if: steps.mode.outputs.run == 'true'
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.mode.outputs.run == 'true'
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deb:
    name: deb (${{ matrix.arch }})
    needs: frontend
    if: needs.frontend.outputs.run == 'true'
    # The package is architecture dependent (compiled wheels): it is built and tested in a
    # Debian 13 container of its architecture, arm64 on the native arm runner (free for public
    # repositories). The repository variable ARM64_RUNNER=ubuntu-24.04 falls back to qemu.
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.frontend.outputs.arches) }}
    runs-on: ${{ matrix.arch == 'arm64' && (vars.ARM64_RUNNER || 'ubuntu-24.04-arm') || 'ubuntu-24.04' }}
    # The emulated arm64 install test (qemu fallback) alone ran past 45 minutes on v0.3.1.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Runner
        run: echo "runner $(uname -m), package ${{ matrix.arch }}"
      - name: qemu (arm64 package on an x86 runner)
        if: matrix.arch == 'arm64' && runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64
      - name: qemu-system (the emulated install test boots an arm64 VM)
        if: matrix.arch == 'arm64' && runner.arch != 'ARM64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-arm qemu-efi-aarch64 ipxe-qemu cloud-image-utils qemu-utils
      - name: Debian cloud image cache (emulated install test)
        if: matrix.arch == 'arm64' && runner.arch != 'ARM64'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pelagos-smoke
          key: debian-13-arm64-cloud-v1
      - name: make deb (Debian 13 container)
        run: packaging/deb/container-build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-${{ matrix.arch }}
          path: build/deb/*.deb
          if-no-files-found: error
      - name: Sum of the package under test
        run: sha256sum build/deb/*.deb | tee tested-deb-${{ matrix.arch }}.sha256
      - name: Install and start (Debian 13 with systemd, BIND and Kea 2.6 from Debian)
        timeout-minutes: ${{ matrix.arch == 'arm64' && runner.arch != 'ARM64' && 150 || 45 }}
        run: packaging/tests/deb-systemd-smoke.sh build/deb/pelagos_*_${{ matrix.arch }}.deb
      - name: The tested package is the uploaded one
        run: sha256sum -c tested-deb-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.full
        with:
          name: tested-deb-${{ matrix.arch }}
          path: tested-deb-${{ matrix.arch }}.sha256
          if-no-files-found: error

  rpm:
    name: rpm (el${{ matrix.el }})
    needs: frontend
    if: needs.frontend.outputs.run == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        el: ${{ fromJSON(needs.frontend.outputs.els) }}
    container: rockylinux/rockylinux:${{ matrix.el }}
    steps:
      - name: Build dependencies
        run: dnf install -y -q git make findutils rpm-build systemd-rpm-macros ${{ matrix.el == 9 && 'python3.12 python3.12-pip' || 'python3 python3-pip' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: frontend/dist
      - name: make rpm
        # The binary package only: the source rpm is not shipped.
        run: make rpm && rm -f build/rpm/*.src.rpm && ls build/rpm/*.rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-el${{ matrix.el }}
          path: build/rpm/*.rpm
          if-no-files-found: error
      - name: Install and run (dependencies from the distribution)
        run: |
          sha256sum build/rpm/*.rpm | tee tested-rpm-el${{ matrix.el }}.sha256
          dnf install -y -q build/rpm/*.rpm
          pelagos version
          sha256sum -c tested-rpm-el${{ matrix.el }}.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.full
        with:
          name: tested-rpm-el${{ matrix.el }}
          path: tested-rpm-el${{ matrix.el }}.sha256
          if-no-files-found: error

  docker:
    name: docker (${{ matrix.arch }})
    needs: frontend
    if: needs.frontend.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.frontend.outputs.arches) }}
    # The ISC images of the compose stack (internetsystemsconsortium/bind9,
    # docker.cloudsmith.io/isc/docker/kea-*) are published for linux/amd64 only: compose runs on
    # amd64. arm64 runs on the native arm runner (ARM64_RUNNER=ubuntu-24.04: qemu).
    runs-on: ${{ matrix.arch == 'arm64' && (vars.ARM64_RUNNER || 'ubuntu-24.04-arm') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: frontend/dist
      - name: qemu (arm64 image on an x86 runner)
        if: matrix.arch == 'arm64' && runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        # The binfmt installer must run as the host arch, not the job default platform.
        env:
          DOCKER_DEFAULT_PLATFORM: ""
        with:
          platforms: arm64
      - name: make docker
        run: make docker
      - name: Compose smoke test
        if: matrix.arch == 'amd64'
        # The runner's resolver holds port 53: the smoke test publishes DNS on 5300.
        run: packaging/tests/compose-smoke.sh pelagos:latest
      - name: make docker-allinone (Kea 3.2 from ISC)
        run: make docker-allinone
      - name: All-in-one smoke test (Kea 3.2 from ISC)
        run: packaging/tests/allinone-smoke.sh pelagos-allinone:latest
      - name: make docker-allinone (Kea 2.6 from Debian)
        run: make docker-allinone KEA_SOURCE=distro IMAGE=pelagos-distro
      - name: All-in-one smoke test (Kea 2.6 from Debian, bare hook names)
        run: packaging/tests/allinone-smoke.sh pelagos-distro-allinone:latest
      - name: Save the tested images (release)
        if: inputs.full
        run: |
          docker tag pelagos:latest pelagos:release-${{ matrix.arch }}
          docker tag pelagos-allinone:latest pelagos-allinone:release-${{ matrix.arch }}
          docker save pelagos:release-${{ matrix.arch }} pelagos-allinone:release-${{ matrix.arch }} | gzip -1 > images-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.full
        with:
          name: images-${{ matrix.arch }}
          path: images-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
