// Catalog zones (producer and consumer) and response policy zones.
options {
	directory "/var/cache/bind";
	recursion yes;
	allow-recursion { 192.0.2.0/24; };
	catalog-zones {
		zone "catalog.example.lan"
			default-primaries { 192.0.2.1; }
			zone-directory "catz"
			in-memory no
			min-update-interval 10;
	};
	response-policy {
		zone "rpz.example.lan" policy given;
		zone "block.example.lan" policy nxdomain max-policy-ttl 1h;
	} break-dnssec no qname-wait-recurse no;
};

zone "catalog.example.lan" {
	type secondary;
	file "catalog.example.lan.db";
	primaries { 192.0.2.1; };
};

zone "producer.example.lan" {
	type primary;
	file "producer.example.lan.db";
	also-notify { 192.0.2.2; };
	allow-transfer { 192.0.2.2; };
	notify explicit;
};

zone "member.example.lan" {
	type primary;
	file "member.example.lan.db";
};

zone "rpz.example.lan" {
	type primary;
	file "rpz.example.lan.db";
	allow-query { none; };
};

zone "block.example.lan" {
	type primary;
	file "block.example.lan.db";
	allow-query { none; };
};
