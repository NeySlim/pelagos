# SPDX-License-Identifier: Apache-2.0
# Release artifacts: the deb (Debian 13), the rpms (RHEL 9 and 10), the node and all-in-one
# images with their smoke tests. A push or pull request touching packaging/ or docker/ builds the
# amd64 set only (deb, rpm el10, images). Version tags, the nightly run (when main moved in the
# last day) and a manual run build everything, arm64 included. Only a version tag pushes the
# images to ghcr.io/<owner>/pelagos and ghcr.io/<owner>/pelagos-allinone and creates a GitHub
# release carrying the packages and SHA256SUMS. ghcr packages start private: make them public
# once (package settings) before documenting a ghcr.io image for users.
name: packages

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: &packaging-paths
      - packaging/**
      - docker/**
      - .github/workflows/packages.yml
  pull_request:
    paths: *packaging-paths
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release and images (only on a v* tag, with the owner's approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}-${{ github.event_name }}
  # A newer push supersedes the running one; release tags always run to the end.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  frontend:
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      run: ${{ steps.mode.outputs.run }}
      arches: ${{ steps.mode.outputs.arches }}
      els: ${{ steps.mode.outputs.els }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Mode (full set on tags, nightly and manual runs)
        id: mode
        run: |
          run=true arches='["amd64"]' els='[10]'
          case "$GITHUB_EVENT_NAME/$GITHUB_REF_TYPE" in
            schedule/*|workflow_dispatch/*|push/tag) arches='["amd64","arm64"]' els='[9,10]' ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ -z "$(git log -1 --since=25.hours --format=%h)" ]; then
            run=false
          fi
          printf 'run=%s\narches=%s\nels=%s\n' "$run" "$arches" "$els" | tee -a "$GITHUB_OUTPUT"
      - name: Version (a tag must match backend/pelagos/__init__.py)
        id: version
        run: |
          version="$(packaging/version.sh python)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the project version $version" >&2
            exit 1
          fi
          image_tag="$(packaging/version.sh docker)"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          # PEP 440 pre-releases (dev, a, b, rc) carry a dash in the image tag.
          case "$image_tag" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.mode.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        if: steps.mode.outputs.run == 'true'
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.mode.outputs.run == 'true'
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deb:
    name: deb (${{ matrix.arch }})
    needs: frontend
    if: needs.frontend.outputs.run == 'true'
    # The package is architecture dependent (compiled wheels): it is built and tested in a
    # Debian 13 container of its architecture. arm64 runs under qemu on an x86 runner by
    # default (always available); the repository variable ARM64_RUNNER=ubuntu-24.04-arm opts
    # in to the native arm runner once the account has it.
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.frontend.outputs.arches) }}
    runs-on: ${{ matrix.arch == 'arm64' && (vars.ARM64_RUNNER || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Runner
        run: echo "runner $(uname -m), package ${{ matrix.arch }}"
      - name: qemu (arm64 package on an x86 runner)
        if: matrix.arch == 'arm64' && runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64
      - name: qemu-system (the emulated install test boots an arm64 VM)
        if: matrix.arch == 'arm64' && runner.arch != 'ARM64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-arm qemu-efi-aarch64 ipxe-qemu cloud-image-utils qemu-utils
      - name: Debian cloud image cache (emulated install test)
        if: matrix.arch == 'arm64' && runner.arch != 'ARM64'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pelagos-smoke
          key: debian-13-arm64-cloud-v1
      - name: make deb (Debian 13 container)
        run: packaging/deb/container-build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-${{ matrix.arch }}
          path: build/deb/*.deb
          if-no-files-found: error
      - name: Install and start (Debian 13 with systemd, BIND and Kea 2.6 from Debian)
        timeout-minutes: 45
        run: packaging/tests/deb-systemd-smoke.sh build/deb/pelagos_*_${{ matrix.arch }}.deb

  rpm:
    name: rpm (el${{ matrix.el }})
    needs: frontend
    if: needs.frontend.outputs.run == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        el: ${{ fromJSON(needs.frontend.outputs.els) }}
    container: rockylinux/rockylinux:${{ matrix.el }}
    steps:
      - name: Build dependencies
        run: dnf install -y -q git make findutils rpm-build systemd-rpm-macros ${{ matrix.el == 9 && 'python3.12 python3.12-pip' || 'python3 python3-pip' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: frontend/dist
      - name: make rpm
        run: make rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-el${{ matrix.el }}
          path: build/rpm/*.rpm
          if-no-files-found: error

  docker:
    name: docker (${{ matrix.arch }})
    needs: frontend
    if: needs.frontend.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.frontend.outputs.arches) }}
    # The ISC images of the compose stack (internetsystemsconsortium/bind9,
    # docker.cloudsmith.io/isc/docker/kea-*) are published for linux/amd64 only: compose runs on
    # amd64. arm64 runs under qemu on an x86 runner unless ARM64_RUNNER opts in to the arm one.
    runs-on: ${{ matrix.arch == 'arm64' && (vars.ARM64_RUNNER || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: frontend/dist
      - name: qemu (arm64 image on an x86 runner)
        if: matrix.arch == 'arm64' && runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        # The binfmt installer must run as the host arch, not the job default platform.
        env:
          DOCKER_DEFAULT_PLATFORM: ""
        with:
          platforms: arm64
      - name: make docker
        run: make docker
      - name: Compose smoke test
        if: matrix.arch == 'amd64'
        # The runner's resolver holds port 53: the smoke test publishes DNS on 5300.
        run: packaging/tests/compose-smoke.sh pelagos:latest
      - name: make docker-allinone (Kea 3.2 from ISC)
        run: make docker-allinone
      - name: All-in-one smoke test (Kea 3.2 from ISC)
        run: packaging/tests/allinone-smoke.sh pelagos-allinone:latest
      - name: make docker-allinone (Kea 2.6 from Debian)
        run: make docker-allinone KEA_SOURCE=distro IMAGE=pelagos-distro
      - name: All-in-one smoke test (Kea 2.6 from Debian, bare hook names)
        run: packaging/tests/allinone-smoke.sh pelagos-distro-allinone:latest

  publish:
    # Only a manual run on a tag with publish set publishes; a pushed tag never does.
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [frontend, deb, rpm, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: pelagos
            dockerfile: docker/Dockerfile
          - image: pelagos-allinone
            dockerfile: docker/allinone/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Image name
        id: name
        # ghcr.io wants a lowercase repository path.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=${{ needs.frontend.outputs.image_tag }}
            type=raw,value=latest,enable=${{ needs.frontend.outputs.prerelease == 'false' }}
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [frontend, deb, rpm, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: "{deb-*,rpm-*}"
          merge-multiple: true
      - name: SHA256SUMS
        run: cd dist && sha256sum -- *.deb *.rpm > SHA256SUMS && cat SHA256SUMS
      - name: GitHub release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.frontend.outputs.prerelease }}
        run: |
          prerelease=""
          [ "$IS_PRERELEASE" = true ] && prerelease="--prerelease"
          # Idempotent: a re-run after a partial failure replaces the assets.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --title "Pelagos ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
          fi
