// BIND 9 configuration for the Pelagos compose stack (internetsystemsconsortium/bind9).
// rndc.key is generated by the pelagos-init service; rndc and the statistics channel
// listen on the compose network for the pelagos service. "pelagos install" or
// "pelagos import" add the include lines for /etc/bind/pelagos when the node adopts
// this server; nothing else in this file is managed.

include "/etc/bind/rndc.key";

controls {
    inet 0.0.0.0 port 953 allow { any; } keys { "rndc-pelagos"; };
};

statistics-channels {
    inet 0.0.0.0 port 8053 allow { any; };
};

options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { any; };
    recursion no;
    allow-query { any; };
    allow-transfer { none; };
    dnssec-validation no;
};

logging {
    channel stderr_log {
        stderr;
        severity info;
        print-time yes;
        print-category yes;
    };
    category default { stderr_log; };
    category queries { null; };
};
