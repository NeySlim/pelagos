controls {
	inet 0.0.0.0 port 953 allow {
		"any";
	} keys {
		"rndc-key";
	};
};
options {
	directory "/var/cache/bind";
	listen-on  {
		"any";
	};
	listen-on-v6  {
		"any";
	};
	allow-recursion {
		"any";
	};
	dnssec-validation no;
	recursion yes;
	allow-query {
		"any";
	};
	allow-transfer  {
		"any";
	};
	forwarders {
		192.0.2.53;
	};
};
statistics-channels {
	inet 0.0.0.0 port 8053 allow {
		"any";
	};
};
key "kea-ddns" {
	algorithm "hmac-md5";
	secret "bGVnYWN5LWtlYS1kZG5zLXNlY3JldC0wMDAwMDAwMDAwMDA=";
};
key "legacy-xfr" {
	algorithm "hmac-sha1";
	secret "bGVnYWN5LXhmci1zZWNyZXQtMDAwMDAwMDAwMDAwMDAwMDA=";
};
key "rndc-key" {
	algorithm "hmac-md5";
	secret "cm5kYy1sZWdhY3ktc2VjcmV0LTAwMDAwMDAwMDAwMDAwMDA=";
};
zone "example.lan" {
	type primary;
	file "/var/lib/bind/db.example.lan";
	allow-update {
		key "kea-ddns";
		192.0.2.5/32;
	};
	also-notify {
		192.0.2.2;
	};
	notify explicit;
};
zone "2.0.192.in-addr.arpa" {
	type primary;
	file "/var/lib/bind/db.2.0.192";
	allow-transfer  {
		192.0.2.2/32;
		key "legacy-xfr";
	};
	allow-update {
		192.0.2.5/32;
		192.0.2.6/32;
	};
};
zone "corp.example.lan" {
	type primary;
	file "/var/lib/bind/db.corp.example.lan";
	update-policy {
		grant "kea-ddns" zonesub "ANY";
	};
	allow-transfer  {
		key "legacy-xfr";
	};
};
zone "example.net" {
	type secondary;
	file "db.example.net";
	primaries {
		192.0.2.9 key "legacy-xfr";
	};
};
