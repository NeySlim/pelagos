{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": []
    },
    "control-sockets": [
      { "socket-type": "unix", "socket-name": "/run/kea/kea4-ctrl-socket" }
    ],
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },
    "hooks-libraries": [
      { "library": "libdhcp_lease_cmds.so" },
      { "library": "libdhcp_host_cmds.so" },
      { "library": "libdhcp_subnet_cmds.so" },
      { "library": "libdhcp_stat_cmds.so" }
    ],
    "dhcp-ddns": {
      "enable-updates": false,
      "server-ip": "127.0.0.1",
      "server-port": 53001
    },
    "valid-lifetime": 3600,
    "renew-timer": 900,
    "rebind-timer": 1800,
    "subnet4": [],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [ { "output": "stdout" } ],
        "severity": "INFO"
      }
    ]
  }
}
