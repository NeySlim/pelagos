// Split horizon with two views, keys selecting the view, and Pelagos includes per view.
key "internal-xfr" {
	algorithm hmac-sha256;
	secret "c2VjcmV0LWZvci10ZXN0cy1vbmx5LWludGVybmFsLXhmcg==";
};
key "external-xfr" {
	algorithm hmac-sha256;
	secret "c2VjcmV0LWZvci10ZXN0cy1vbmx5LWV4dGVybmFsLXhmcg==";
};

acl "lan" { 192.0.2.0/24; 2001:db8::/64; };

options {
	directory "/var/cache/bind";
	recursion no;
	allow-transfer { none; };
};

view "internal" {
	match-clients { !key external-xfr; key internal-xfr; lan; };
	recursion yes;
	allow-recursion { lan; };

	zone "example.lan" {
		type primary;
		file "internal/example.lan.db";
		allow-transfer { key internal-xfr; };
		update-policy { grant ddi-admin zonesub A AAAA PTR; };
	};

	zone "2.0.192.in-addr.arpa" {
		type primary;
		file "internal/2.0.192.in-addr.arpa.db";
		allow-update { key internal-xfr; };
	};

	include "/etc/bind/pelagos/views/internal.conf";
};

view "external" {
	match-clients { any; };
	recursion no;

	zone "example.lan" {
		type secondary;
		file "external/example.lan.db";
		primaries port 5300 { 192.0.2.1 key external-xfr; };
	};
};
